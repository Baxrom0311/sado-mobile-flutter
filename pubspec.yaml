name: sado_mobile
description: "SADO - Nutq Terapiyasi. Bolalar nutqini rivojlantirish platformasi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  record: ^6.2.1
  just_audio: ^0.9.43
  fl_chart: ^1.0.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  lottie: ^3.3.1
  shimmer: ^3.0.0
  gap: ^3.0.1
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  confetti: ^0.7.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3
  mocktail: ^1.0.4
  # Used by widget tests to stub the platform-side connectivity plugin.
  connectivity_plus_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.8
  # Used by ExternalUrlLauncher unit tests to swap in a deterministic
  # mock for `url_launcher` without bouncing into a real browser.
  url_launcher_platform_interface: ^2.3.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/animations/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#2ECC71"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
